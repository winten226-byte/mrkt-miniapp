<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRKT Sniper & Feed</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #17212b);
            --card-bg: var(--tg-theme-secondary-bg-color, #232e3c);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --accent-color: var(--tg-theme-button-color, #5288c1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 12px;
            margin: 0;
            box-sizing: border-box;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: var(--card-bg);
            color: var(--text-color);
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            opacity: 0.6;
        }

        .tab-btn.active {
            opacity: 1;
            background: var(--accent-color);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
        }

        h2 { font-size: 15px; margin: 0 0 10px 0; color: #64b5f6; }

        /* Сетка для отображения подарков */
        .gifts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
        }

        /* Оформление карточки подарка */
        .gift-card {
            background: #1c2733;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
        }

        .gift-preview {
            width: 100%;
            height: 130px;
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gift-preview img {
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
        }

        .gift-details {
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .gift-title {
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .gift-price {
            font-size: 13px;
            color: #00e676;
            font-weight: bold;
        }

        .gift-meta {
            font-size: 10px;
            color: #8fa3b8;
        }

        .buy-btn {
            display: block;
            text-align: center;
            background: var(--accent-color);
            color: #fff;
            text-decoration: none;
            padding: 6px 0;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            margin-top: 4px;
        }

        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        input[type="number"] {
            width: 65px;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid #3e4e61;
            background: var(--bg-color);
            color: #fff;
            text-align: center;
        }

        .main-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: var(--accent-color);
            color: #fff;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('feed')">🎁 Лента Подарков</button>
        <button class="tab-btn" onclick="switchTab('settings')">⚙️ Настройки</button>
    </div>

    <!-- Вкладка Ленты -->
    <div id="tab-feed" class="tab-content active">
        <div id="gifts-container" class="gifts-grid">
            <div style="grid-column: 1/-1; text-align: center; color: #8fa3b8; padding: 20px;">
                Загрузка последних подарков с MRKT...
            </div>
        </div>
    </div>

    <!-- Вкладка Настроек -->
    <div id="tab-settings" class="tab-content">
        <div class="card">
            <h2>📊 Фильтр Цены</h2>
            <div class="form-row">
                <span>Макс. флор (+%):</span>
                <input type="number" id="multiplier" step="0.01" value="1.02">
            </div>
        </div>
        <button class="main-btn" id="saveBtn">Сохранить настройки</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const CDN_BASE = "https://cdn.tgmrkt.io/";

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            if (tabName === 'feed') {
                event.target.classList.add('active');
                document.getElementById('tab-feed').classList.add('active');
            } else {
                event.target.classList.add('active');
                document.getElementById('tab-settings').classList.add('active');
            }
        }

        // Автоматическое получение свежих лотов напрямую через API MRKT
        async function fetchFeed() {
            try {
                const response = await fetch('https://api.tgmrkt.io/api/v1/feed', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ count: 12, cursor: "", ordering: "Latest", lowToHigh: false })
                });

                if (!response.ok) return;

                const data = await response.json();
                const container = document.getElementById('gifts-container');
                container.innerHTML = '';

                (data.items || []).forEach(item => {
                    const gift = item.gift || {};
                    const coll = gift.collectionName || gift.title || 'Gift';
                    const model = gift.modelName || '';
                    const backdrop = gift.backdropName || '';
                    const number = gift.number ? `#${gift.number}` : '';
                    
                    const priceNano = item.amount || gift.salePrice || 0;
                    const priceTon = (priceNano / 1e9).toFixed(2);
                    
                    const centerColor = gift.backdropColorsCenterColor || '#232e3c';
                    const edgeColor = gift.backdropColorsEdgeColor || centerColor;
                    const modelImgKey = gift.modelStickerThumbnailKey || '';

                    const uuid = (gift.id || '').replace(/-/g, '');
                    const buyUrl = `https://t.me/mrkt/app?startapp=${uuid}`;

                    const card = document.createElement('div');
                    card.className = 'gift-card';
                    card.innerHTML = `
                        <div class="gift-preview" style="background: radial-gradient(circle, ${centerColor} 0%, ${edgeColor} 100%);">
                            ${modelImgKey ? `<img src="${CDN_BASE}${modelImgKey}" alt="Model">` : ''}
                        </div>
                        <div class="gift-details">
                            <div class="gift-title">${coll} ${number}</div>
                            <div class="gift-price">${priceTon} TON</div>
                            <div class="gift-meta">${model}</div>
                            <div class="gift-meta">🎨 ${backdrop}</div>
                            <a href="${buyUrl}" class="buy-btn" target="_blank">Купить</a>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                console.error("Ошибка загрузки карточек:", e);
            }
        }

        fetchFeed();
        setInterval(fetchFeed, 5000); // Обновляем каждые 5 секунд

        document.getElementById('saveBtn').addEventListener('click', () => {
            const multiplier = parseFloat(document.getElementById('multiplier').value);
            tg.sendData(JSON.stringify({ max_multiplier: multiplier }));
        });
    </script>
</body>
</html>
