<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MRKT Sniper Control</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #121418;
      --card-bg: #1c1f26;
      --accent-color: #248bf5;
      --accent-green: #2ecc71;
      --text-color: #ffffff;
      --text-muted: #8e94a0;
      --border-color: #2a2e39;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      user-select: none;
    }

    .header {
      text-align: center;
      margin-bottom: 8px;
    }

    .header h2 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .header p {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 4px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .setting-label {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .setting-title {
      font-size: 15px;
      font-weight: 600;
    }

    .setting-desc {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Стили тумблера (Switch) */
    .switch {
      position: relative;
      display: inline-block;
      width: 48px;
      height: 28px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #2c303b;
      transition: .3s;
      border-radius: 28px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 22px;
      width: 22px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent-green);
    }

    input:checked + .slider:before {
      transform: translateX(20px);
    }

    /* Стили полей ввода */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-field {
      background: #121418;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      border-color: var(--accent-color);
    }

    /* Кнопка сохранения */
    .save-btn {
      background: var(--accent-color);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s, transform 0.1s;
    }

    .save-btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="header">
    <h2>🎯 MRKT Sniper Control</h2>
    <p>Настройки авто-снайпинга и офферов</p>
  </div>

  <div class="card">
    <!-- Тумблер Авто-покупки -->
    <div class="setting-item">
      <div class="setting-label">
        <span class="setting-title">🚀 Авто-покупка</span>
        <span class="setting-desc">Выкуп лотов до +2% от флора</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="autoBuy" checked>
        <span class="slider"></span>
      </label>
    </div>

    <hr style="border: 0; border-top: 1px solid var(--border-color);">

    <!-- Тумблер Авто-офферов -->
    <div class="setting-item">
      <div class="setting-label">
        <span class="setting-title">📩 Авто-офферы</span>
        <span class="setting-desc">Офферы по флору при цене от +3%</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="autoOffer" checked>
        <span class="slider"></span>
      </label>
    </div>

    <hr style="border: 0; border-top: 1px solid var(--border-color);">

    <!-- Лимит Флора -->
    <div class="input-group">
      <span class="setting-title">📊 Лимит авто-покупки (множитель)</span>
      <span class="setting-desc">1.02 = Флор + 2%</span>
      <input type="number" id="maxMultiplier" class="input-field" step="0.01" value="1.02">
    </div>
  </div>

  <button class="save-btn" onclick="saveAndClose()">Сохранить настройки</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // Разворачивает Mini App на весь экран

    function saveAndClose() {
      const autoBuy = document.getElementById('autoBuy').checked;
      const autoOffer = document.getElementById('autoOffer').checked;
      const maxMultiplier = parseFloat(document.getElementById('maxMultiplier').value) || 1.02;

      // Отправляем данные обратно боту
      tg.sendData(JSON.stringify({
        auto_buy: autoBuy,
        auto_offer: autoOffer,
        max_multiplier: maxMultiplier
      }));

      // Закрываем Mini App
      tg.close();
    }
  </script>
</body>
</html>
